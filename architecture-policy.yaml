      # 扩展视图的进程内 MCP Client 宣告 MCP Apps 能力、页面资源 mimeType（§8）。
      - mcp-apps-protocol
      - rpc
      - desktop
    publicEntrypoints:
      - packages/desktop/src/extension-host/index.ts
      - packages/desktop/src/extension-host/contract.ts
      - packages/desktop/src/main/extensionHostSupervisor.ts
    layers:
      adapters: .
    owner: plugin
  # extension-slots：Renderer 的贡献表快照、插槽组件（docs/plugins/extension-host.md §6）。
  - id: extension-slots
    roots:
      - packages/ui/src/extension-slots
    managed: true
    requires:
      - extension-host-protocol
      # 扩展视图页面复用 MCP App 的沙箱句柄、握手常量与页面原语（docs/plugins/extension-host.md §8）。
      - mcp-apps-protocol
      - plugin-ui
      - services
      - shared
      - ui
    publicEntrypoints:
      - packages/ui/src/extension-slots/index.ts
      - packages/ui/src/extension-slots/contract.ts
    layers:
      domain: domain
      app: app
      adapters: adapters
      ui: components
    layerOrder: [domain, app, adapters, ui]
    owner: plugin

  # 内置浏览器本地 HTML 的受控文件读取边界。
  - id: browser-local-preview
    roots:
      - packages/desktop/src/main/browser-local-preview
    managed: true
    requires: [shared]
    publicEntrypoints:
      - packages/desktop/src/main/browser-local-preview/index.ts
      - packages/desktop/src/main/browser-local-preview/contract.ts
    layers:
      adapters: .
    owner: desktop
  # plugin-api：插件作者用的类型包 @zcode-dev/plugin-api（docs/plugins/extension-host.md §17.9）。
  # 只转出 extension-host-protocol 与 v4 协议（shared）的类型；四个子入口都是公开入口。
  # tsup.config.ts 与 scripts/ 产出仓库外用的 dist 声明。
  - id: plugin-api
    roots:
      - packages/plugin-api/src
      - packages/plugin-api/scripts
      - packages/plugin-api/tsup.config.ts
    managed: true
    requires:
      - extension-host-protocol
      - shared
    publicEntrypoints:
      - packages/plugin-api/src/contract.ts
      - packages/plugin-api/src/manifest.ts
      - packages/plugin-api/src/sessions.ts
      - packages/plugin-api/src/protocol-v4.ts
    layers:
      contract: .
    owner: plugin
  # 选区批注输入浮层；调用方是 v4 选区浮层，引用数据仍归 ui lib。
  - id: selection-comment
    roots:
      - packages/ui/src/selection-comment
    managed: true
    requires:
      - ui
    publicEntrypoints:
      - packages/ui/src/selection-comment/index.ts
      - packages/ui/src/selection-comment/contract.ts
    layers:
      ui: .
    owner: conversation

  - id: web-auth
    roots:
      - packages/web/src/auth
    managed: true
    requires:
      - mobile-ui
      - shared
      - ui
    publicEntrypoints:
      - packages/web/src/auth/index.ts
      - packages/web/src/auth/contract.ts
    layers:
      app: .
    owner: identity

  - id: credential-security
    roots:
      - packages/shared/src/credential-security
    managed: true
    requires: [shared]
    publicEntrypoints:
      - packages/shared/src/credential-security/module.ts
      - packages/shared/src/credential-security/contract.ts
    layers:
      adapters: .
    owner: authentication

  - id: resource-manager
    roots:
      - packages/ui/src/resource-manager
      - packages/services/src/process/processResourceSampler.ts
    managed: true
    requires: [shared, ui]
    publicEntrypoints:
      - packages/ui/src/resource-manager/ResourceManagerApp.tsx
      - packages/ui/src/resource-manager/contract.ts
      - packages/ui/src/resource-manager/resourceUsageView.ts
      - packages/services/src/process/processResourceSampler.ts
    layers:
      contract: contract.ts
      adapters: ../../../services/src/process/processResourceSampler.ts
      ui: .
    layerOrder: [contract, adapters, ui]
    owner: desktop
  # settings-search：由 architecture:adopt 登记
  - id: settings-search
    roots:
      - packages/ui/src/settings-search
    managed: true
    requires:
      - ui
    publicEntrypoints:
      - packages/ui/src/settings-search/index.ts
      - packages/ui/src/settings-search/contract.ts
    layers:
      ui: .
    owner: settings
  # task-row-hover：会话行悬停卡片（docs/ui/task-row-hover-details.md）
  - id: task-row-hover
    roots:
      - packages/ui/src/task-row-hover
    managed: true
    requires:
      - managed-worktree-ui
      - shared
      - ui
    publicEntrypoints:
      - packages/ui/src/task-row-hover/index.ts
      - packages/ui/src/task-row-hover/contract.ts
    layers:
      ui: .
    owner: conversation

  # cli-memory-diagnostics：由 architecture:adopt 登记
  - id: cli-memory-diagnostics
    roots:
      - apps/zcode-cli/packages/adapters/src/memory-diagnostics
      - apps/zcode-cli/packages/adapters/tests/memory-diagnostics
      - apps/zcode-cli/packages/bootstrap/src/zcode-protocol/resource-sampler.ts
      - packages/services/src/feedback/feedbackLogArchive.ts
    managed: true
    requires: [shared, zcode-cli]
    publicEntrypoints:
      - apps/zcode-cli/packages/adapters/src/memory-diagnostics/index.ts
      - apps/zcode-cli/packages/adapters/src/memory-diagnostics/contract.ts
      - apps/zcode-cli/packages/bootstrap/src/zcode-protocol/resource-sampler.ts
      - packages/services/src/feedback/feedbackLogArchive.ts
    layers:
      adapters: .
    owner: agent

global:
  # 临时时间戳（2026-09-10）：unmanaged-new-file 只约束此日期之后首次入库的文件。
  # 基于领先 staging 很多的分支开工时，merge-base 之前的"新增"文件不应被追溯。
  newFilesEnforcedSince: "2026-09-10"
  acceptedUpstreamCommits: []
  maxFileLines: 800
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true
  acceptedUpstreamSnapshot: scripts/architecture/upstream-snapshot.json

exceptions:
  - id: region-copy-suggested-prompts-edit
    rule: unmanaged-new-file
    paths: [packages/ui/src/v4/featureSuggestedPrompts.ts]
    reason: 上游 f3fcc23e04 已引入的模式推荐提示词仅替换「国内」为「中国」一处区域称谓；本次不接管整个 ui 未受管模块。
  - id: removed-tool-grouping-action-catalog
    rule: unmanaged-new-file
    paths: [packages/ui/src/lib/userActionTraceCatalog.ts]
    reason: 上游已有埋点目录仅删除已移除分组选项的三个事件声明；本次不接管整个 UI lib 目录。
  - id: assistant-block-order-tool-part-order-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/core/src/agent/tool-part-order.ts]
    reason: 已准入的工具 part 选择只增加 blockIndex 排序（apps/zcode-cli/docs/design/v2/model/assistant-block-order.md），declarationIndex 与物理顺序兜底不变；接管整个 core 包不在本次范围内。
  - id: assistant-block-order-prompt-trajectory-continuity-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/tools/prompt-trajectory/src/message-continuity.ts]
    reason: 已准入的调试工具比较回复前折叠多个文字块，适配每个文字块单独回放（apps/zcode-cli/docs/design/v2/model/assistant-block-order.md）；只读比较逻辑，不改变模块边界。
  - id: session-features-attribution-header-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/adapters/src/model/runner-attribution.ts]
    reason: The admitted attribution header builder only appends x-zcode-session-features (docs/design/v2/model/session-features-header.md); it remains the single write point for all attribution headers, with unchanged signature and module boundary. Taking over the whole adapters package is out of scope.
  - id: session-features-workflow-command-pattern-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/core/src/runtime/methods/dynamic-workflow-activation.ts]
    reason: The admitted dynamic workflow activation only exports the existing `/workflow` history criterion constant, so session-features history derivation reuses the same criterion; activation behavior, owner and module boundary are unchanged.
  - id: node-repl-call-ledger-cua-bridge-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/node-repl-host/src/cua-bridge.ts]
    reason: The admitted node_repl CUA bridge only removes the Worker-side session info construction and target app identity recording; both move to the main-thread CUA broker (apps/zcode-cli/docs/design/v2/tool/20-node-repl-call-ledger.md). Subagent rejection and model-facing behavior are unchanged; taking over the whole node-repl-host package is out of scope.
  - id: node-repl-call-ledger-cua-broker-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/node-repl-host/src/cua-broker.ts]
    reason: The admitted node_repl CUA broker now only accepts the per-call token issued by node-repl-call-ledger, builds session info from the ledger entry and records the target app identity in the ledger (20-node-repl-call-ledger.md "CUA broker"); MR !3207 additionally records computerUse, used for the session capability label, in the ledger after token validation (docs/design/v2/model/session-features-header.md). Runtime call and response formats are unchanged.
  - id: node-repl-call-ledger-result-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/node-repl-host/src/result.ts]
    reason: The admitted node_repl result assembly now takes only trusted keys from the ledger facts and ignores same-named fields in the Worker result message (20-node-repl-call-ledger.md "Result assembly"); MR !3207 appends the zcode/nodeReplBrowserUse and zcode/nodeReplComputerUse keys in the same way (docs/design/v2/model/session-features-header.md). Result content and other meta handling are unchanged.
  - id: offpeak-expiration-codes-existing-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/core/src/runtime/off-peak/model-binding.ts]
    reason: The admitted idle-request wrapper only reuses the shared error code check, adding the existing lifecycle notice for the 3106 run timeout; owner, control protocol and module boundary are unchanged, and it does not expand to takeover of the whole CLI runtime directory.
  - id: multi-cursor-badge-title-passthrough-edit
    rule: unmanaged-new-file
    paths:
      - apps/zcode-cli/packages/node-repl-host/src/cua-broker.ts
    reason: 已准入的 node_repl CUA broker 仅增透传可选 actionTitle 字段（node_repl cell title → badge 文字，docs/cua/producer/multi-session-cursor-overlay-spec.md §4.8）——cua-broker 按 ledger meta 构建的 requestContext 注入、parseContext 白名单补字段；签名、broker 形态与模块边界不变，不接管 zcode-cli 目录。
  - id: conversation-share-manage-scope-passthrough-edit
    rule: unmanaged-new-file
    paths: [packages/services/src/conversation-share/conversationShareConnectionScope.ts]
    reason: 已准入的分享 attachment 作用域包装只追加设置页分享管理的四个方法（docs/conversation-share-v1.md「设置页分享管理」）：桌面分支原样透传，手机远控分支拒绝；不改变 R3 受信连接、发布/导入作用域与模块边界，接管整个 services/conversation-share 目录（含既有超长文件）不在本次范围内。
  - id: conversation-selection-comment-quote-schema-edit
    rule: unmanaged-new-file
    paths: [packages/shared/src/conversationSelection.ts]
    reason: 已准入的对话引用 schema 只追加可选 comment 与 agent 字段（选区批注，docs/ui/conversation-selection-side-chat.md「选区批注」）；仍是 conversationQuotes 的唯一 schema，长度上限与模块边界不变，接管整个 shared 包不在本次范围内。
  - id: conversation-selection-comment-model-guidance-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/core/src/runtime/helpers/conversation-quotes.ts]
    reason: 已准入的引用模型材料拼装只在引用带批注时追加一句说明（docs/ui/conversation-selection-side-chat.md「选区批注」）；仍是 withConversationQuotes 的唯一实现，canonical 正文与 Bot 投递边界不变，接管整个 core 包不在本次范围内。
  - id: side-pane-full-view-shortcut-command-edit
    rule: unmanaged-new-file
    paths: [packages/shared/src/shortcutCommands.ts]
    reason: 已准入的快捷键命令表只追加一条 toggleSidePaneFullView 命令（Side Pane 完整视图，docs/ui/side-pane-full-view.md）；命令表仍是唯一数据源，签名与模块边界不变，接管整个 shared 包不在本次范围内。
  - id: browser-session-recent-visits-ui
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/store/browserRecentVisitsStore.ts
    reason: Session 最近访问仅为 renderer 内存态展示数据，复用既有 UI store 与浏览器 owner，不改变 UI 模块边界或跨层契约。
  - id: zcode-site-deploy-runtime-template
    rule: unmanaged-new-file
    paths:
      [apps/zcode-cli/packages/zcode-site-plugin/skills/site-deploy/templates/static-server.mjs]
    reason: Static site server template copied into the user's deployment package by the site-deploy skill; it is executed only by start.sh inside the Sites runner container. Repository code does not import it and it belongs to no runtime module. The start.sh template in the same directory is shell and is not covered by this rule.
  - id: opensource-cua-test-project-config
    rule: unmanaged-new-file
    paths: [packages/zcode-cua/vitest.config.ts]
    reason: 该文件只装配测试项目，开源占位版本用于保持根单测入口可运行；不包含 producer 运行逻辑，不为同目录实现文件开放例外。
  - id: project-location-cache-recovery-existing-edit
    rule: unmanaged-new-file
    paths:
      - packages/shared/src/project-access-token.ts
      - packages/shared/src/project-access-token-client.ts
      - packages/services/src/model-provider/accountProjectTokenClient.ts
      - packages/services/src/credential/credentialService.ts
    reason: 已有项目 Token 与凭据存储增加派生缓存的局部恢复端口，并把换证请求失败按固定类别分码（ZCT-2111046389485834240）；已确认的 PAT 签发临时故障仅在原 pending 内重试一次，不扩展到 Key 创建或 OAuth；保持原有 owner 和共享文件锁，不接管全目录。
  - id: plugin-agent-permission-mode-restrict-only-existing-edit
    rule: unmanaged-new-file
    paths:
      - packages/shared/src/subagent-profile.ts
      - packages/shared/src/subagent-profile-parser.ts
    reason: Adds an in-process profile marker field and updates comments in already-admitted legacy files so a plugin agent's permissionMode can only be tightened (ZP-20261028-13); the cross-process schema and parsing behavior are unchanged, and taking over the shared directory is out of scope for this change.
  - id: test-ids-subpath-import-unmanaged-edit
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/browser-use/EmbeddedBrowserPermissionPrompts.tsx
      - packages/ui/src/hooks/useStartPlanRecommendation.ts
      - packages/ui/src/settings/DynamicWorkflowModeSetting.tsx
    reason: 已准入的存量文件只把 TID 导入从 @zcode/shared 根入口改为 @zcode/shared/test-ids 子路径（根入口不再导出 test-ids，以收窄受影响单测范围）；行为与模块边界不变，接管 ui 目录不在本次范围内。
  - id: remote-workspace-admission-deadline-existing-edit
    rule: unmanaged-new-file
    paths: [packages/desktop/src/host/remoteWorkspacePreparation.ts]
    reason: The admitted remote project directory admission only adds a 30-second deadline and a retryable no-response error code (3.16.2 remote regression R8, docs/remote/project-first-remote-navigation-spec.md §2.4); owner, callers and module boundary are unchanged; taking over the desktop host directory is out of scope for this fix.
  - id: gen-ui-existing-capability-check
    rule: unmanaged-new-file
    paths: [packages/services/src/zcode-agent/independentPlanSupport.ts]
    reason: Adds a GenUI context capability check to the existing CLI capability query entry, so an old CLI does not silently drop state; keeps the existing services/agent boundary and does not expand this fix to takeover of the whole zcode-agent module.
  - id: connection-log-secret-token-unmanaged-edit
    rule: unmanaged-new-file
    paths: [packages/shared/src/source-server/connectionLog.ts]
    reason: 已存在的连接日志过滤函数只把已知秘密从子串替换改为完整 token 匹配，修复短密码反推泄露；签名与模块边界不变，接管整个 shared 包不在本次修复范围内。
  - id: connection-errors-econnreset-unmanaged-edit
    rule: unmanaged-new-file
    paths: [packages/shared/src/source-server/connectionErrors.ts]
    reason: 已存在的连接错误归一化码表补一项 ECONNRESET → remote-host-unreachable，修复在线断连恢复失败被误报为预检失败；签名与模块边界不变，接管整个 shared 包不在本次修复范围内。
  - id: remote-authentication-unsupported-presentation-unmanaged-edit
    rule: unmanaged-new-file
    paths: [packages/ui/src/lib/remoteConnectionPresentationErrors.ts]
    reason: Maps the existing remote connection error display to a new public code, remote-authentication-unsupported, adding a title and a "View details" action, so a failed SSH second-factor check is no longer shown as a password check; signature and module boundary are unchanged; taking over the ui directory is out of scope for this fix.
  - id: source-server-operation-log-level-unmanaged-edit
    rule: unmanaged-new-file
    paths: [packages/desktop/src/host/sourceServerOperationLogs.ts]
    reason: The existing connection log wrapper passes through the level defined by TransportContext, so the low-glibc hint keeps warn; Host remains the only log owner; signature and module boundary are unchanged; taking over the whole desktop package is out of scope.
  - id: client-config-public-field-unmanaged-edit
    rule: unmanaged-new-file
    paths: [packages/shared/src/clientConfig.ts]
    reason: Existing upstream public config parser gains one validated recommendation field; ownership and module boundaries remain unchanged, and adopting the shared package is outside this change.
  - id: highspeed-transcript-owner-existing-edit
    rule: unmanaged-new-file
    paths: [packages/ui/src/highspeed/highspeedTurnHydration.ts]
    reason: 该文件已存在于集成基线；本次仅在既有 transcript 水合映射中保留稳定匿名 ownerKey，不新增模块、IO 或状态 owner。账号归属校验仍由 Host 执行，UI store 继续拥有临时查询占位。接管整个 UI 目录不在此变更范围，行为和验收见 docs/highspeed/highspeed-card-spec.md。
  - id: client-config-optional-authorization-existing-readers
    rule: unmanaged-new-file
    paths:
      - packages/services/src/client-config/clientConfigService.ts
      - packages/provider-node/src/zcode-builtin-download.ts
    reason: 现有配置读取器新增宿主注入的可选 JWT，并隔离身份缓存和 CDN 请求头；不新增源码文件或改变服务与下载器的 owner，整包架构接管不属于本次请求头修复。
  - id: highspeed-fallback-snapshot-unmanaged-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/core/src/runtime/methods/turn-execution-fallback.ts]
    reason: 合并已存在于 staging 的加速卡回退模块，仅将可变 Session 读取替换为本轮固定候选；保持现有 Core 模块边界，不在同步分支时机械拆分整个 runtime。
  - id: session-owned-workflow-shutdown-existing-files
    rule: unmanaged-new-file
    paths:
      - apps/zcode-cli/packages/bootstrap/src/app/dynamic-workflow-run-submit.ts
      - apps/zcode-cli/packages/bootstrap/src/app/workflow-driver-quiescence.ts
    reason: Both files already exist in the integration baseline; this change adds startup/shutdown mutual exclusion and actor cleanup waiting within the existing bootstrap owner, without adding modules or cross-layer dependencies. Taking over the whole bootstrap/app is governed separately; the public lifecycle module boundary is unchanged.
  - id: workflow-quota-auto-resume-unmanaged-file
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/bootstrap/src/app/dynamic-workflow-quota-resume.ts]
    reason: Auto-resume of runs stopped at the quota limit when the reset time arrives; a host module beside the run service (reads journal rows, subscribes to settlement, resumes via an injected resume). It belongs to the unmanaged zcode-cli bootstrap together with the run service files in the same directory; taking over this directory needs a separate module boundary cleanup.
  - id: mcp-node-fallback-unmanaged-file
    rule: unmanaged-new-file
    paths:
      - apps/zcode-cli/packages/adapters/src/mcp/node-fallback.ts
      - apps/zcode-cli/packages/bootstrap/src/app/mcp-node-fallback.ts
    reason: stdio MCP node/npm/npx fallback under Desktop Electron Node (apps/zcode-cli/docs/design/v2/mcp-node-fallback.md). The adapters file only handles the shim directory and child process env merge, injected via CreateMcpAdapterOptions.nodeFallback; the bootstrap file only detects Electron and provides the bundled npm candidate directory. Both belong to the unmanaged zcode-cli; taking over adapters/mcp or bootstrap/app needs a separate module boundary cleanup.
  - id: workflow-unrecognized-code-cap-unmanaged-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/adapters/src/model/workflow-model-failure-policy.ts]
    reason: 已准入的 workflow 模型错误策略表只增加一行（分类器不认识的业务码在同一次请求里连续出现 10 次时停 run）、一个连续计数入参与两个计数纯函数；runner 与 driver 读同一函数的约束与模块边界不变，接管 adapters/model 目录不在本次范围内。
  - id: plugin-async-discovery-existing-callers
    rule: unmanaged-new-file
    paths:
      - apps/zcode-cli/packages/bootstrap/src/zcode-protocol/plugin-ui-surfaces.ts
      - apps/zcode-cli/packages/bootstrap/src/zcode-protocol/runtime-cleanup.ts
      - apps/zcode-cli/packages/cli/src/plugins-command-shared.ts
      - apps/zcode-cli/packages/cli/src/plugins-marketplace-command.ts
      - apps/zcode-cli/packages/cli/src/tui-prompt-handler-queries.ts
    reason: 已有插件发现调用方迁移为 await；runtime-cleanup 在原进程关闭编排中释放注入的准备 owner，没有新增文件。对应契约见 docs/workspace-capability-discovery-cache.md，不为此次异步化与预热接管整个 CLI 或协议目录。
  - id: automation-self-pause-turn-visibility-existing-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/core/src/runtime/methods/turn-tool-visibility.ts]
    reason: The existing turn tool visibility owner only adds the reverse visibility rule for the current automation's self-pause; no new cross-module dependency or owner is introduced; taking over the whole zcode-cli runtime is beyond the scope of this defect fix.
  - id: compact-bundle-reminder-builder-unmanaged-edit
    rule: unmanaged-new-file
    paths: [apps/zcode-cli/packages/core/src/runtime/methods/runtime-reminder-persistence.ts]
    reason: The already-landed hidden reminder persistence function is split so that a separate function only builds the record, letting compaction hand the announcement, summary and attachment to the same store transaction; the record no longer writes the tools field, and the interrupt marker body is taken as plain user text. Core module boundary is unchanged; taking over the whole runtime directory is out of scope.

version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints:
      - packages/services/src/session/contract.ts
      - packages/services/src/session/taskIndexRepo.ts
      - packages/services/src/session/automationRepo.ts
      - packages/services/src/session/offPeakTaskRepo.ts
      - packages/services/src/session/tasksDatabase/migrations.ts
      - packages/services/src/session/tasksDatabase/prepared.ts
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: stream-animate
    roots: [packages/stream-animate/src]
    managed: false
  - id: e2e-report
    roots: [packages/e2e-report/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false
  # sqlite-migrations：由 architecture:adopt 登记
  - id: conversation-telemetry-engine
    roots: [packages/shared/src/conversation-telemetry]
    managed: true
    requires: [shared]
    publicEntrypoints:
      - packages/shared/src/conversation-telemetry/index.ts
      - packages/shared/src/conversation-telemetry/contract.ts
      - packages/shared/src/conversation-telemetry/messageTelemetry.ts
      - packages/shared/src/conversation-telemetry/providerTelemetryIdentity.ts
      - packages/shared/src/conversation-telemetry/remoteTelemetryEvent.ts
    layers: { app: "." }
    owner: conversation
  - id: conversation-telemetry-service
    roots: [packages/services/src/conversation-telemetry]
    managed: true
    requires: [shared, services, rpc, conversation-telemetry-engine]
    publicEntrypoints:
      - packages/services/src/conversation-telemetry/remoteConversationTelemetry.ts
      - packages/services/src/conversation-telemetry/contract.ts
    layers: { app: "." }
    owner: conversation
  - id: sqlite-migrations
    roots:
      - packages/shared/src/sqlite-migrations
    managed: true
    requires: []
    publicEntrypoints:
      - packages/shared/src/sqlite-migrations/index.ts
      - packages/shared/src/sqlite-migrations/contract.ts
    layers:
      adapters: .
    owner: persistence
  # project-storage：由 architecture:adopt 登记
  - id: project-storage
    roots:
      - packages/services/src/project-storage
    managed: true
    requires:
      - shared

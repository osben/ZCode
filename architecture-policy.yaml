global:
  # 临时时间戳（2026-09-10）：unmanaged-new-file 只约束此日期之后首次入库的文件。
  # 基于领先 staging 很多的分支开工时，merge-base 之前的"新增"文件不应被追溯。
  newFilesEnforcedSince: "2026-09-10"
  acceptedUpstreamCommits: []
  maxFileLines: 800
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true
  acceptedUpstreamSnapshot: scripts/architecture/upstream-snapshot.json

exceptions:
  - id: port-3163-local-tool-search-unmanaged-files
    rule: unmanaged-new-file
    paths:
      - apps/zcode-cli/packages/core/src/tool/handlers/deferred-tool-call.ts
      - apps/zcode-cli/packages/core/src/tool/search/description.ts
      - apps/zcode-cli/packages/core/src/tool/search/exposure.ts
      - apps/zcode-cli/packages/core/src/tool/search/history.ts
      - apps/zcode-cli/packages/core/src/tool/search/local-projection.ts
      - apps/zcode-cli/tools/prompt-trajectory/src/tool-search-comparison.ts
    reason: Pre-port of the upstream 3.16.3 LocalToolSearch name (specs/port-3.16.3-local-tool-search.md) edits existing upstream tool-search files in place. The zcode-cli tree has no managed module yet; adopting it needs a separate module boundary refactor. Remove this entry when the real 3.16.3 source replaces the port.
  - id: subagent-skill-grants-unmanaged-file
    rule: unmanaged-new-file
    paths:
      - apps/zcode-cli/packages/core/src/runtime/methods/subagent-skill-grants.ts
    reason: Fork-owned subagent skill grant resolver (specs/subagent-skill-identity.md), kept out of the upstream-owned subagent.ts to limit sync conflicts. The zcode-cli tree has no managed module yet; adopting it needs a separate module boundary refactor.
  - id: tool-loop-patterns-unmanaged-file
    rule: unmanaged-new-file
    paths:
      - apps/zcode-cli/packages/core/src/runtime/helpers/tool-loop-patterns.ts

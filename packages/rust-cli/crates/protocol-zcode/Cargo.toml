[package]
name = "rust-cli-protocol-zcode"
description = "The App protocol front end of rust-cli (V4 methods, commands, topics and the legacy methods the Host still calls)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
# wire v3 的分片（dataBase64）。
base64.workspace = true
rust-cli-base.workspace = true
# Fork: desktop attachment refs are local paths (the Host's zero-copy prompt attachment transfer).
rust-cli-fs.workspace = true
rust-cli-kernel-api.workspace = true
rust-cli-protocol-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

[package]
name = "rust-cli-protocol-zcode"
description = "The App protocol front end of rust-cli (V4 methods, commands, topics and the legacy methods the Host still calls)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
# wire v3 的分片（dataBase64）。
base64.workspace = true
rust-cli-base.workspace = true
# Fork: GBK / GB18030 detection of desktop text attachments (Node `text-metadata.ts`).
encoding_rs.workspace = true
# Fork: attached images are prepared for the model like Node's Jimp adapter.
rust-cli-image.workspace = true
# Fork: row commands wait for a preempted turn on the session's event stream.
futures-util.workspace = true
# Fork: desktop attachment refs are local paths (the Host's zero-copy prompt attachment transfer).
rust-cli-fs.workspace = true
rust-cli-kernel-api.workspace = true
rust-cli-protocol-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "sync", "time"] }
tracing.workspace = true
# Fork: the Network panel sanitizes request URLs like Node's WHATWG `URL` (network_capture.rs).
url.workspace = true

[dev-dependencies]
# Builds the test images of attachment preparation.
image.workspace = true
rust-cli-kernel-api = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

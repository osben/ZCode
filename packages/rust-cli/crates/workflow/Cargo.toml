[package]
name = "rust-cli-workflow"
description = "The dynamic workflow engine core (deterministic, no I/O beyond the journal port) for rust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
# 日志的 dwf_* 仓储（W2）：端口的一个实现直接落在它上面。
rust-cli-node-store.workspace = true
rusqlite.workspace = true
# JS 语义的 JSON 文本（JSON.stringify 的字符串转义与数字形式）。
rust-cli-base.workspace = true
# The model error and the workflow failure policy table (W6b part 3): the table is shared with the model governor.
rust-cli-kernel-api.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
# The real-git world read test runs git in a temporary repository (Node `workflow-git-world-read-real.test.ts`).
tempfile.workspace = true

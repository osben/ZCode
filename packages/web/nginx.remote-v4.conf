server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The QR carries the pairing secret in the query string; keep it out of access logs and referrers.
  location /remote/v4/ {
    access_log off;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ /remote/v4/index.html;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}

# Fork: license inventory of the crates linked into zcode-rs (specs/fork-agent-runtime-selection.md, "Licensing").
# Every license the dependency graph uses is permissive; a new license fails the release build until it is reviewed here.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "ISC",
  "Zlib",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "bzip2-1.0.6",
  "0BSD",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

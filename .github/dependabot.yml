version: 2
updates:
  # pnpm workspace: the root directory covers pnpm-workspace.yaml packages
  # (packages/*, apps/zcode-cli, apps/zcode-cli/packages/*, apps/zcode-cli/tools/*)
  # and the single root pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "fork"
    schedule:
      interval: "weekly"

  # Workflows pin actions to full commit SHAs with a `# vX.Y.Z` comment; Dependabot bumps the SHA
  # and the comment together. One grouped PR per week instead of one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "fork"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

name: PR checks

on:
  pull_request:
    branches: [fork]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Persistent V8 compile cache (Node >= 22.1). The unit suite is import-bound (module
  # load dominates wall time), and a local A/B with the same worker count measured
  # ~-30% wall. Safe across node_modules updates: cache entries are keyed per source.
  # Absolute: a relative path resolves against each process cwd, so Node children started in
  # temp fixture repos would write .v8-cache there and make them look dirty.
  NODE_COMPILE_CACHE: ${{ github.workspace }}/.v8-cache

jobs:
  # Path gate for the Rust job. A workflow-level `paths` filter would skip the TS jobs too, and a
  # job skipped by `if` still satisfies a required check, so the gate lives at job level.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      rust-cli: ${{ steps.diff.outputs.rust-cli }}
    steps:
      # Same merge-base as the unit-tests job; trees only, no blobs.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Diff against the merge-base
        id: diff
        run: |
          set -euo pipefail
          base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          # Captured, not piped into `grep -q`: grep exits on the first match, git diff then dies
          # of SIGPIPE on a large diff, and pipefail turns a real change into "false".
          changed="$(git diff --name-only "$base" HEAD -- packages/rust-cli)"
          echo "packages/rust-cli files changed since $base: $(grep -c . <<<"$changed" || true)"
          if [ -n "$changed" ]; then
            echo "rust-cli=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust-cli=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    # Name kept identical to the pre-split job so existing branch-protection required
    # checks keep matching; add the new "Unit tests" job to protection as well.
    name: Typecheck, lint, architecture
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The format check diffs against the pinned upstream sync base and needs full history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore V8 compile cache
        uses: actions/cache@v4
        with:
          path: .v8-cache
          # Commit-specific keys keep every run saveable: a shared lock-based key is
          # immutable once saved, so entries for changed sources would never persist
          # between lockfile bumps, and the two parallel jobs would race on one key.
          # github.sha is identical for both parallel jobs of one run, so a per-commit key
          # alone still leaves them racing to save one immutable entry — and the checks
          # job finishes ~4x earlier, systematically winning and dropping the richer
          # unit-tests snapshot. Discriminate by github.job so both lineages persist.
          key: node-compile-v1-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-${{ github.sha }}
          # Dep bumps change only part of node_modules; stale entries are ignored by
          # content hashing, so restoring an older cache is still a net win.
          restore-keys: |
            node-compile-v1-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-
            node-compile-v1-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-
            node-compile-v1-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-
            node-compile-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Full check: `--changed` diffs against HEAD, which is the merge commit in PR CI, so it would miss the PR's changes.
      - name: Architecture check
        run: pnpm architecture:check

      - name: Instruction command contract
        run: pnpm instruction-commands:check

      - name: Frozen upstream migrations
        run: pnpm db:migrations:check

      - name: Pre-push runner regression tests
        run: pnpm test:pre-push

      # Upstream 3.17.1 static gates (specs/fork-test-pipeline.md).
      - name: E2E remote targets, stale doc phrases, architecture and engineering tooling tests
        run: |
          set -euo pipefail
          pnpm check:e2e-remote-targets
          pnpm docs:stale-phrases:check
          pnpm test:architecture
          pnpm test:engineering-tools

      # Pending upstream exemption (specs/fork-format-scope.md): when fork-upstream-base.json names
      # a pendingUpstreamCommit the checkout lacks, fetch it by URL. No-op when the field is absent.
      - name: Fetch pending upstream commit
        run: node scripts/fork-format-pending.mjs --fetch

      # Same command as local: only files the fork changed since the upstream sync base pinned in
      # fork-upstream-base.json (specs/fork-format-scope.md). Upstream-identical files stay
      # untouched so upstream syncs do not conflict; a sync PR bumps the pin in the same PR.
      - name: Format check (fork-changed files)
        run: pnpm fmt:check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # Affected selection diffs against the merge-base with the base branch (specs/pr-affected-unit-tests.md);
      # the merge-base needs history, like the checks job.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # scripts/*.test.mjs (pre-commit fixtures) read the real fork-upstream-base.json and fail
      # loudly when pendingUpstreamCommit is set but absent from the clone.
      - name: Fetch pending upstream commit
        run: node scripts/fork-format-pending.mjs --fetch

      - name: Restore V8 compile cache
        uses: actions/cache@v4
        with:
          path: .v8-cache
          # Commit-specific keys keep every run saveable: a shared lock-based key is
          # immutable once saved, so entries for changed sources would never persist
          # between lockfile bumps, and the two parallel jobs would race on one key.
          # github.sha is identical for both parallel jobs of one run, so a per-commit key
          # alone still leaves them racing to save one immutable entry — and the checks
          # job finishes ~4x earlier, systematically winning and dropping the richer
          # unit-tests snapshot. Discriminate by github.job so both lineages persist.
          key: node-compile-v1-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            node-compile-v1-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.job }}-
            node-compile-v1-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}-
            node-compile-v1-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-
            node-compile-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm can skip dependency postinstalls when a warm store cache is restored. Re-run
      # Electron's installer (it skips a valid installation) and assert the binary exists.
      - name: Ensure Electron binary
        run: |
          electron_package_dir="$(node -p 'require("node:path").dirname(require.resolve("electron"))')"
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD node "$electron_package_dir/install.js"
          electron_binary="$(node -e 'const fs = require("node:fs"); const path = require("node:path"); const dir = path.dirname(require.resolve("electron")); const name = fs.readFileSync(path.join(dir, "path.txt"), "utf8").trim(); process.stdout.write(path.join(dir, "dist", name))')"
          test -x "$electron_binary"

      - name: Build workspace packages needed by unit tests
        # storage-preparation 协议用例经 bootstrap 源码引用 @zcode/adapters/storage 的 dist 导出，
        # 其类型链依赖 contracts 与 dynamic-workflow，需按拓扑顺序先构建。
        run: >
          pnpm --filter @zcode/contracts --filter @zcode/dynamic-workflow --filter @zcode/adapters --filter @zcode/e2e-report build

      - name: Build official plugin runtimes needed by unit tests
        # bootstrap official-plugin-definitions.ts requires built artifacts that are not committed:
        # dist/server.mjs and dist/ui/* for the document viewers (office-runtime build), and
        # dist/mcp/server.js for node-repl-host (also used by browser-use). "@zcode/node-repl-host..."
        # builds its workspace dependencies (@zcode/core and friends) first.
        run: >
          pnpm --filter "@zcode/node-repl-host..." --filter @zcode/browser-use-plugin --filter @zcode/documents-plugin --filter @zcode/pdf-plugin --filter @zcode/presentations-plugin --filter @zcode/spreadsheets-plugin build

      # The pre-commit regression tests run the wrapper against this checkout,
      # so make the pending upstream blob available just as in the checks job.
      - name: Fetch pending upstream commit
        run: node scripts/fork-format-pending.mjs --fetch

      - name: Tests
        # Affected unit execution per specs/pr-affected-unit-tests.md: Vitest official selection against
        # the PR's merge-base; full suite on manifest changes, full selection, and in the scheduled run.
        env:
          # Node 26's experimental Web Storage shadows jsdom's localStorage. scripts/run-vitest.mjs
          # injects this flag for the full CLI run and run-pre-push.mjs for the affected runner; a
          # direct affected invocation needs it on the process before Vitest starts.
          NODE_OPTIONS: --no-experimental-webstorage
        run: |
          set -euo pipefail
          base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          # Dependency manifests are invisible to the import graph (forceRerunTriggers globs do not
          # match the files themselves), so manifest changes fall back to the full unit suite.
          if git diff --name-only "$base" HEAD | grep -qxE 'pnpm-lock\.yaml|(.*/)?package\.json'; then
            echo "[tests] dependency manifest changed since $base: running full unit suite"
            pnpm test:engineering
            pnpm test:fork
          else
            pnpm test:engineering:affected -- --base "$base" --on-full run
          fi
          pnpm test:node
          # Relay suites sit outside both manifests and the affected selection; run them on every PR.
          pnpm test:relay

  # Vendored upstream Rust agent (specs/fork-agent-runtime-selection.md, "Source"). It has no
  # package.json, so the pnpm jobs above do not see it. Debug profile only: a release build bumps
  # the tracked packages/rust-cli/build-number, which must never be committed.
  rust-cli:
    name: Rust CLI (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.rust-cli == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        # rustup reads rust-toolchain.toml from the cwd upward, not from --manifest-path.
        working-directory: packages/rust-cli
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Keeps the cached target directory small while panics still show file:line.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5

      # Installs the channel and components pinned in packages/rust-cli/rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # vendor/ugrep is C++ and links libstdc++ statically on linux-gnu (vendor/ugrep/build.rs).
      # env-local's shell tests run commands under /bin/zsh as well as /bin/bash.
      - name: Install g++, the static libstdc++ and zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends g++ zsh

      - name: Restore cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/rust-cli/target
          # Per-commit key keeps every run saveable (an existing key is immutable); restore-keys
          # fall back to the newest entry for the same toolchain and lockfile, then toolchain only.
          key: rust-cli-v1-${{ runner.os }}-${{ hashFiles('packages/rust-cli/rust-toolchain.toml') }}-${{ hashFiles('packages/rust-cli/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-cli-v1-${{ runner.os }}-${{ hashFiles('packages/rust-cli/rust-toolchain.toml') }}-${{ hashFiles('packages/rust-cli/Cargo.lock') }}-
            rust-cli-v1-${{ runner.os }}-${{ hashFiles('packages/rust-cli/rust-toolchain.toml') }}-

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Two upstream tests are flaky (also locally, before the fork touched them):
      # - rust-cli-fs exclusive::tests::only_one_holder_at_a_time fails about 1 run in 3;
      # - rust-cli-platform team::platform_tests::an_account_change_during_the_query_discards_the_round
      #   fails under full parallel load.
      # The workspace run skips them (--skip is a substring match; the team:: prefix keeps the
      # same-named personal:: test in the run), then each runs alone, up to 3 attempts.
      - name: cargo test
        run: >
          cargo test --workspace --locked --no-fail-fast --
          --skip exclusive::tests::only_one_holder_at_a_time
          --skip team::platform_tests::an_account_change_during_the_query_discards_the_round

      - name: cargo test (known upstream flakes, isolated with retries)
        run: |
          set -uo pipefail
          run_flaky() {
            local package="$1" test="$2" attempt
            for attempt in 1 2 3; do
              if cargo test --locked -p "$package" --lib -- --exact "$test"; then
                return 0
              fi
              echo "::warning::$package $test failed on attempt $attempt"
            done
            return 1
          }
          run_flaky rust-cli-fs exclusive::tests::only_one_holder_at_a_time || exit 1
          run_flaky rust-cli-platform team::platform_tests::an_account_change_during_the_query_discards_the_round || exit 1

      - name: build-number untouched
        run: git diff --exit-code -- build-number

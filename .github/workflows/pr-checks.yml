name: PR checks

on:
  pull_request:
    branches: [integration]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, architecture
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build workspace packages needed by unit tests
        # storage-preparation 协议用例经 bootstrap 源码引用 @zcode/adapters/storage 的 dist 导出，
        # 其类型链依赖 contracts 与 dynamic-workflow，需按拓扑顺序先构建。
        run: >
          pnpm --filter @zcode/contracts --filter @zcode/dynamic-workflow --filter @zcode/adapters build

      - name: Tests
        run: pnpm test

      # Full check: `--changed` diffs against HEAD, which is the merge commit in PR CI, so it would miss the PR's changes.
      - name: Architecture check
        run: pnpm architecture:check

      # Only files touched by this PR; the repo has pre-existing format drift elsewhere.
      # oxfmt ignores lockfiles and similar files, so a PR with only those would otherwise fail on "no target files".
      # Upstream sync merges bring thousands of upstream-formatted files; reformatting them would
      # turn every future sync into a conflict avalanche, so those PRs (label: upstream-sync) skip this step.
      - name: Format check (changed files)
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'upstream-sync') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...HEAD" \
            | xargs -0 -r pnpm exec oxfmt --check --no-error-on-unmatched-pattern

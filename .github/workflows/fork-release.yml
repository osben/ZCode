name: Fork release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve-version:
    name: Resolve next fork version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fetch tags
        # release-fork.mjs derives the next -fork.N counter from existing git tags.
        run: git fetch --tags origin

      - name: Resolve next fork version
        id: version
        run: |
          next="$(node scripts/release-fork.mjs --print)"
          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null 2>&1; then
            echo "::error::Tag v${next} already exists on origin"
            exit 1
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"

  build-macos-arm64:
    name: Build macOS arm64 (dmg + zip, ${{ matrix.variant }})
    strategy:
      fail-fast: true
      # Fork: two apps per release (specs/fork-preview-rs-identity.md). "preview" is ZCode Preview
      # (Node agent by default); "preview-rs" is ZCode Preview RS (own app id, Rust agent by default).
      matrix:
        variant: [preview, preview-rs]
    needs: resolve-version
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # The desktop installer does not bundle the dev mock-cdn remote assets; skipping their
      # cross-platform download keeps the release job well under the timeout (same as upstream CI).
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ZCODE_TARGET_OS: darwin
      ZCODE_TARGET_ARCH: arm64
      # Production backend: without an explicit ZCODE_ENV the build silently defaults to the test
      # backend environment (scripts/builtin-provider-config.mjs), baking X-Release-Channel: test
      # into every model request; the z.ai backend rejects the production account token there, so
      # every model call fails with 401 auth_failed. Job-level env covers both the bundle step and
      # electron-builder (the config re-resolves the environment at packaging time).
      ZCODE_ENV: production
      # Keep the "ZCode Preview" identity so releases upgrade existing fork installs in place and
      # stay side-by-side with a regular ZCode.app; identity is independent of backend environment.
      ZCODE_PREVIEW_IDENTITY: "1"
      ZCODE_FORK_RS_IDENTITY: ${{ matrix.variant == 'preview-rs' && '1' || '0' }}
      # Auto-update stays compile-time off in fork releases (scripts/build-time-config.mjs reads
      # ZCODE_AUTO_UPDATE): enabled, the updater would query the upstream release manifest and
      # offer official Z.ai builds over the fork. Preview flavor already blocks the updater at
      # runtime; this pins the build-time flag explicitly so nothing can re-enable it accidentally.
      ZCODE_AUTO_UPDATE: "0"
      # Self-hosted remote-control defaults baked into the release (public deployment inputs, not
      # secrets). Empty when the repository variables are absent: the build then keeps the upstream
      # external-relay behavior. Both must be set together — one-sided or malformed values fail the
      # build by design (scripts/build-time-config.mjs).
      ZCODE_WEB_REMOTE_CONTROL_RELAY_WS_URL: ${{ vars.ZCODE_WEB_REMOTE_CONTROL_RELAY_WS_URL }}
      ZCODE_WEB_REMOTE_CONTROL_URL: ${{ vars.ZCODE_WEB_REMOTE_CONTROL_URL }}
      ZCODE_WEB_REMOTE_CONTROL_RELAY_IDENTITY_MODE: ${{ vars.ZCODE_WEB_REMOTE_CONTROL_RELAY_IDENTITY_MODE }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set build-only version
        # Build-only: package.json in git keeps the upstream version, so upstream syncs stay
        # conflict-free. prepare:build-meta and electron-builder pick the version up from here.
        run: pnpm pkg set version="${{ needs.resolve-version.outputs.version }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundles and runtime assets
        run: pnpm --filter @zcode/desktop build

      # Fork: build the zcode-rs agent and stage it with its licenses as <resources>/zcode-rs
      # (specs/fork-agent-runtime-selection.md, "Packaging"). ZCode Preview defaults to node; ZCode
      # Preview RS defaults to rust (specs/fork-preview-rs-identity.md).
      - name: Install pinned Rust toolchain
        working-directory: packages/rust-cli
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - name: Restore cargo registry and release target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-about
            packages/rust-cli/target
          key: rust-cli-release-v1-${{ runner.os }}-${{ hashFiles('packages/rust-cli/rust-toolchain.toml', 'packages/rust-cli/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-cli-release-v1-${{ runner.os }}-${{ hashFiles('packages/rust-cli/rust-toolchain.toml', 'packages/rust-cli/Cargo.lock') }}-

      - name: Build zcode-rs (macOS arm64)
        working-directory: packages/rust-cli
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: "0"
          # Keeps proc-macro dylib metadata on macOS (the release profile strips).
          CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP: "false"
        run: cargo build --release --locked -p rust-cli --bin zcode-rs

      - name: Generate zcode-rs crate licenses
        working-directory: packages/rust-cli
        shell: bash
        run: |
          command -v cargo-about >/dev/null || cargo install --locked cargo-about --version 0.9.3 --features cli
          cargo about generate --fail -c ../../scripts/fork-rust-agent/about.toml -m Cargo.toml \
            ../../scripts/fork-rust-agent/about.hbs -o target/CRATE-LICENSES.md

      - name: Stage zcode-rs into desktop resources
        shell: bash
        run: >-
          node scripts/fork-rust-agent/stage-resources.mjs
          --binary packages/rust-cli/target/release/zcode-rs
          --crate-licenses packages/rust-cli/target/CRATE-LICENSES.md

      - name: Package with electron-builder (unsigned)
        # --publish never: the config's generic publish URL is a localhost placeholder; the
        # GitHub Release is created separately in the release job.
        run: >-
          pnpm --filter @zcode/desktop exec electron-builder
          --config electron-builder.config.js --mac --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-arm64-${{ matrix.variant }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          retention-days: 7
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows x64 (nsis, ${{ matrix.variant }})
    strategy:
      fail-fast: true
      # Fork: two apps per release (specs/fork-preview-rs-identity.md). "preview" is ZCode Preview
      # (Node agent by default); "preview-rs" is ZCode Preview RS (own app id, Rust agent by default).
      matrix:
        variant: [preview, preview-rs]
    needs: resolve-version
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ZCODE_TARGET_OS: win32
      ZCODE_TARGET_ARCH: x64
      # Same rationale as build-macos-arm64: explicit production backend environment.
      ZCODE_ENV: production
      ZCODE_PREVIEW_IDENTITY: "1"
      ZCODE_FORK_RS_IDENTITY: ${{ matrix.variant == 'preview-rs' && '1' || '0' }}
      # Same auto-update kill switch as build-macos-arm64; see the comment there.
      ZCODE_AUTO_UPDATE: "0"
      # Same self-hosted remote-control defaults as build-macos-arm64; see the comment there.
      ZCODE_WEB_REMOTE_CONTROL_RELAY_WS_URL: ${{ vars.ZCODE_WEB_REMOTE_CONTROL_RELAY_WS_URL }}
      ZCODE_WEB_REMOTE_CONTROL_URL: ${{ vars.ZCODE_WEB_REMOTE_CONTROL_URL }}
      ZCODE_WEB_REMOTE_CONTROL_RELAY_IDENTITY_MODE: ${{ vars.ZCODE_WEB_REMOTE_CONTROL_RELAY_IDENTITY_MODE }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set build-only version
        run: pnpm pkg set version="${{ needs.resolve-version.outputs.version }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundles and runtime assets
        run: pnpm --filter @zcode/desktop build

      # Fork: build the zcode-rs agent and stage it with its licenses as <resources>/zcode-rs
      # (specs/fork-agent-runtime-selection.md, "Packaging"). ZCode Preview defaults to node; ZCode
      # Preview RS defaults to rust (specs/fork-preview-rs-identity.md).
      - name: Install pinned Rust toolchain
        working-directory: packages/rust-cli
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - name: Restore cargo registry and release target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-about.exe
            packages/rust-cli/target
          key: rust-cli-release-v1-${{ runner.os }}-${{ hashFiles('packages/rust-cli/rust-toolchain.toml', 'packages/rust-cli/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-cli-release-v1-${{ runner.os }}-${{ hashFiles('packages/rust-cli/rust-toolchain.toml', 'packages/rust-cli/Cargo.lock') }}-

      - name: Build zcode-rs (Windows x64)
        working-directory: packages/rust-cli
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: "0"
          # Keeps proc-macro dylib metadata on macOS (the release profile strips).
          CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP: "false"
        run: cargo build --release --locked -p rust-cli --bin zcode-rs

      - name: Generate zcode-rs crate licenses
        working-directory: packages/rust-cli
        shell: bash
        run: |
          command -v cargo-about >/dev/null || cargo install --locked cargo-about --version 0.9.3 --features cli
          cargo about generate --fail -c ../../scripts/fork-rust-agent/about.toml -m Cargo.toml \
            ../../scripts/fork-rust-agent/about.hbs -o target/CRATE-LICENSES.md

      - name: Stage zcode-rs into desktop resources
        shell: bash
        run: >-
          node scripts/fork-rust-agent/stage-resources.mjs
          --binary packages/rust-cli/target/release/zcode-rs.exe
          --crate-licenses packages/rust-cli/target/CRATE-LICENSES.md

      - name: Package with electron-builder (unsigned)
        run: >-
          pnpm --filter @zcode/desktop exec electron-builder
          --config electron-builder.config.js --win --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x64-${{ matrix.variant }}
          path: |
            packages/desktop/dist/*.exe
          retention-days: 7
          if-no-files-found: error

  release:
    name: Tag and create GitHub Release
    needs: [resolve-version, build-macos-arm64, build-windows-x64]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      # GitHub's GITHUB_TOKEN cannot create a release for a commit that changes workflows.
      GH_TOKEN: ${{ secrets.FORK_RELEASE_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Verify release token
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Repository Actions secret FORK_RELEASE_TOKEN is required (Contents: write, Workflows: write)."
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          ls -la release-assets
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "ZCode ${VERSION}" \
            --notes "Unsigned fork build (upstream base ${VERSION%%-fork.*}). macOS arm64 + Windows x64. Two apps: ZCode Preview (Node agent) and ZCode Preview RS (Rust agent by default), installable side by side. On macOS Gatekeeper may block the first launch; run \`xattr -cr \"/Applications/ZCode Preview.app\"\` (or \`\"/Applications/ZCode Preview RS.app\"\`) to allow it." \
            release-assets/*
